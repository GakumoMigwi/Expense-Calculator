<!DOCTYPE html>
<html lang="en-KE" data-t="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal Finance Command Centre (KES)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f3f5f9;--c:#fff;--tx:#1b2438;--mu:#6b7488;--bd:#e1e6ef;--nv:#14284b;--inc:#2f5fd0;--sv:#0f9d6b;--wr:#e98a15;--rd:#d63b3b;--pu:#7b4fd0}
[data-t=dark]{--bg:#0e1424;--c:#18213a;--tx:#e8ecf6;--mu:#98a2bd;--bd:#2a3556;--nv:#9db8ff}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
nav{width:210px;background:#14284b;color:#fff;padding:12px 8px;position:sticky;top:0;height:100vh;overflow:auto;flex:none;transition:.2s}
nav.c{width:0;padding:0;overflow:hidden}nav h2{font-size:15px;margin:6px 10px 14px}
nav a{display:block;padding:9px 12px;border-radius:8px;color:#cfd9f2;cursor:pointer}nav a.on,nav a:hover{background:#2a4378;color:#fff}
main{flex:1;min-width:0}header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--c);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
#v{padding:16px;max-width:1300px}h1{font-size:20px;color:var(--nv);margin:0 0 12px}h3{margin:0 0 8px;color:var(--nv);font-size:15px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:14px;box-shadow:0 1px 4px #0001;min-width:0}
.k{cursor:pointer}.k small{color:var(--mu);display:block}.k b{font-size:19px}.d{font-size:12px;display:block}.good{color:var(--sv)}.bad{color:var(--rd)}.mu{color:var(--mu)}
button,input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--c);color:var(--tx)}
button{background:var(--inc);color:#fff;border:0;cursor:pointer}button.s{background:var(--bd);color:var(--tx)}button.r{background:var(--rd)}
table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600}.tw{overflow-x:auto}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%}
dialog{border:0;border-radius:14px;background:var(--c);color:var(--tx);width:min(420px,94vw);padding:18px}dialog::backdrop{background:#0008}
dialog label{display:block;margin:8px 0;color:var(--mu)}dialog input,dialog select{width:100%;display:block;margin-top:3px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;background:var(--bd)}.cv{height:260px;position:relative}
@media(max-width:760px){nav{position:fixed;z-index:9;height:100%}nav.c{width:0}#v{padding:10px}}
@media print{nav,header,button,.np{display:none!important}body{display:block}}
</style></head><body>
<nav id="nav"></nav>
<main><header>
<button class="s" onclick="$('#nav').classList.toggle('c')" aria-label="Toggle menu">☰</button>
<select id="per" onchange="DB.set.period=this.value;save();go()" aria-label="Date range">
<option value="tm">This month</option><option value="lm">Last month</option><option value="3m">Last 3 months</option><option value="6m">Last 6 months</option><option value="ytd">Year to date</option><option value="ly">Previous year</option><option value="all">All time</option><option value="cu">Custom range</option></select>
<span id="cu" class="row"><input type="date" id="f1" onchange="DB.set.from=this.value;save();go()"><input type="date" id="f2" onchange="DB.set.to=this.value;save();go()"></span>
<input id="gs" placeholder="Search records…" style="flex:1;min-width:120px" onkeydown="if(event.key=='Enter'){UI.q=this.value;go('tx')}">
<button class="s" onclick="showAlerts()">🔔 <span id="nb"></span></button>
<button class="s" onclick="DB.set.theme=DB.set.theme=='dark'?'light':'dark';save();theme()">◐</button>
<button onclick="addTx()">+ Add</button></header>
<div id="v"></div></main><dialog id="dlg"></dialog>
<script>
/* ===== STORAGE (LocalStorage; not encrypted) ===== */
const K='kesFinV2',$=s=>document.querySelector(s),UI={q:'',type:'',cat:'',f:{di:0,de:0,n:6,one:0}};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const D=s=>new Date(s+'T00:00'),T=iso(new Date()),uid=()=>'T'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=c=>'KSh '+(c/100).toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2}),dmy=s=>s.split('-').reverse().join('/');
const toC=v=>Math.round(parseFloat(v)*100),pc=(a,b)=>b==0?null:(a-b)/Math.abs(b)*100,pf=p=>p==null?'N/A (no baseline)':(p>0?'+':'')+p.toFixed(1)+'%';
const ICATS=['Salary','Business','Freelance','Consultancy','Rental','Interest','Dividends','Bonus','Allowance','Commission','Gifts received','Refund','Other income'];
const ECATS=['Housing','Food & groceries','Transport','Utilities','Personal','Financial commitments','Social & family','Education','Travel & recreation','Other'];
const METH=['M-Pesa','Cash','Bank transfer','Debit card','Credit card','SACCO','Cheque','Other'],TYPES=['income','expense','savings','debt','transfer'];
const mp=Math.round;
function load(){try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.tx)return d}catch(e){}return blank()}
function save(){try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){alert('Could not save: browser storage unavailable or full.')}}
function blank(){return{tx:[],acc:['M-Pesa','Main bank','SACCO','Cash'].map(n=>({n,open:0})),bud:[],goals:[],debts:[],rec:[],set:{period:'tm',theme:'light',from:T,to:T,lastBackup:null}}}
function seed(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),tx=[];
 const add=(i,d,type,cat,desc,amt,acct,method)=>{const s=iso(new Date(y,m-i,d));if(s<=T)tx.push({id:uid(),date:s,type,cat,desc,amt:amt*100,acct,method,status:'Completed',demo:1})};
 for(let i=5;i>=0;i--){add(i,1,'income','Salary','Monthly salary',120000+i*1000,'Main bank','Bank transfer');if(i%2==0)add(i,12,'income','Freelance','Side project',15000,'M-Pesa','M-Pesa');
 add(i,3,'expense','Housing','Rent',25000,'Main bank','Bank transfer');add(i,10,'expense','Utilities','Electricity & internet',4500+i*120,'M-Pesa','M-Pesa');
 [4,9,16,23].forEach((d,j)=>add(i,d,'expense','Food & groceries','Groceries / meals',3200+((i*377+j*511)%1500),'M-Pesa','M-Pesa'));
 [6,18].forEach((d,j)=>add(i,d,'expense','Transport','Fuel / matatu',2800+((i*233+j*400)%900),'Cash','Cash'));
 add(i,14,'expense','Personal','Clothing & care',3000+i*200,'Main bank','Debit card');add(i,20,'expense','Social & family','Family support',2500,'M-Pesa','M-Pesa');
 add(i,5,'savings','Savings','Emergency fund',15000,'Main bank','Bank transfer');add(i,7,'debt','Loan principal','SACCO loan',8000,'SACCO','SACCO');add(i,7,'expense','Loan interest','SACCO loan interest',2000,'SACCO','SACCO')}
 return{tx,acc:[{n:'M-Pesa',open:2000000},{n:'Main bank',open:15000000},{n:'SACCO',open:5000000},{n:'Cash',open:500000}],
 bud:[['Housing',25000],['Food & groceries',18000],['Transport',8000],['Utilities',6000],['Personal',4000]].map(([c,a])=>({cat:c,amt:a*100,demo:1})),
 goals:[{id:uid(),name:'Emergency fund',target:30000000,cur:9000000,date:iso(new Date(y+1,m,1)),demo:1}],
 debts:[{id:uid(),lender:'SACCO loan',orig:20000000,principal:15000000,rate:12,inst:1000000,method:'reducing',demo:1}],
 rec:[{id:uid(),name:'Rent',amt:2500000,cat:'Housing',freq:'monthly',next:iso(new Date(y,m+1,3)),demo:1},{id:uid(),name:'Home internet',amt:350000,cat:'Utilities',freq:'monthly',next:iso(new Date(y,m,25)),demo:1}],
 set:{period:'tm',theme:'light',from:T,to:T,lastBackup:null}}}
let DB=load();

/* ===== CALCULATION ENGINE (integer cents; single source of truth) ===== */
function range(p=DB.set.period){const t=new Date(),y=t.getFullYear(),m=t.getMonth();let a,b=new Date(y,m+1,0);
 if(p=='tm')a=new Date(y,m,1);else if(p=='lm'){a=new Date(y,m-1,1);b=new Date(y,m,0)}else if(p=='3m')a=new Date(y,m-2,1);else if(p=='6m')a=new Date(y,m-5,1);
 else if(p=='ytd'){a=new Date(y,0,1);b=t}else if(p=='ly'){a=new Date(y-1,0,1);b=new Date(y-1,11,31)}else if(p=='all'){a=new Date(2000,0,1);b=new Date(2100,0,1)}
 else return[DB.set.from||T,DB.set.to||T];return[iso(a),iso(b)]}
function prev([a,b]){const n=Math.round((D(b)-D(a))/864e5)+1,e=new Date(D(a));e.setDate(e.getDate()-1);const s=new Date(e);s.setDate(s.getDate()-n+1);return[iso(s),iso(e)]}
const live=()=>DB.tx.filter(t=>t.status=='Completed');
const sum=(type,[a,b],f)=>live().filter(t=>t.type==type&&t.date>=a&&t.date<=b&&(!f||f(t))).reduce((s,t)=>s+t.amt,0);
const M=r=>({inc:sum('income',r),exp:sum('expense',r),sav:sum('savings',r),debt:sum('debt',r)}),net=o=>o.inc-o.exp-o.sav-o.debt;
function bal(a,asOf='9999'){let b=a.open;live().forEach(t=>{if(t.date>asOf)return;const s=t.type=='income'?1:t.type=='transfer'?0:-1;if(t.acct==a.n)b+=s*t.amt*(t.type=='transfer'?-1:1);if(t.type=='transfer'&&t.to==a.n)b+=t.amt});return b}
const totBal=asOf=>DB.acc.reduce((s,a)=>s+bal(a,asOf),0);
function months(n){const t=new Date(),r=[];for(let i=n-1;i>=0;i--){const a=new Date(t.getFullYear(),t.getMonth()-i,1),b=new Date(t.getFullYear(),t.getMonth()-i+1,0);r.push({l:a.toLocaleString('en-KE',{month:'short',year:'2-digit'}),r:[iso(a),iso(b)]})}return r}
const catSpend=(r)=>{const o={};live().filter(t=>t.type=='expense'&&t.date>=r[0]&&t.date<=r[1]).forEach(t=>o[t.cat]=(o[t.cat]||0)+t.amt);return o};
const monthlyRec=()=>DB.rec.reduce((s,r)=>s+r.amt*({daily:30,weekly:4.33,fortnightly:2.17,monthly:1,quarterly:1/3,annually:1/12})[r.freq],0);
const budStat=()=>{const r=range('tm'),cs=catSpend(r);return DB.bud.map(b=>({...b,act:cs[b.cat]||0,u:b.amt?(cs[b.cat]||0)/b.amt*100:null}))};
function amort(P,rate,n,flat){if(flat){const I=P*rate/100*n/12;return{pay:(P+I)/n,tot:P+I,int:I,rows:[...Array(n)].map((_,i)=>({i:i+1,p:P/n,int:I/n,bal:P-P/n*(i+1)}))}}
 const r=rate/1200,pay=r?P*r/(1-Math.pow(1+r,-n)):P/n;let b=P,ti=0;const rows=[];for(let i=1;i<=n;i++){const it=b*r,pr=pay-it;b-=pr;ti+=it;rows.push({i,p:pr,int:it,bal:Math.max(b,0)})}return{pay,tot:pay*n,int:ti,rows}}
function health(){const ms=months(6).map(m=>M(m.r)),inc=ms.reduce((s,m)=>s+m.inc,0),sv=ms.reduce((s,m)=>s+m.sav,0),bs=budStat(),
 a=inc?Math.min(sv/inc/.2,1)*20:0,b=bs.length?bs.filter(x=>x.u!=null&&x.u<=100).length/bs.length*20:10,c=ms.filter(m=>net(m)>=0).length/6*20,
 di=inc?DB.debts.reduce((s,d)=>s+d.inst,0)*6/inc:0,d=DB.debts.length?20*(1-Math.min(di/.4,1)):20,
 avgE=ms.reduce((s,m)=>s+m.exp,0)/6,e=avgE?Math.min(totBal()/(3*avgE),1)*10:0,f=ms.filter(m=>m.inc>0).length/6*10;
 return{parts:[['Savings rate',a,20],['Budget adherence',b,20],['Cash-flow stability',c,20],['Debt management',d,20],['Emergency cover (3 months)',e,10],['Income stability',f,10]],score:Math.round(a+b+c+d+e+f)}}
function alerts(){const A=[];budStat().forEach(b=>{if(b.u>=100)A.push(`✖ ${b.cat} budget exceeded (${b.u.toFixed(0)}%)`);else if(b.u>=75)A.push(`⚠ ${b.cat} budget at ${b.u.toFixed(0)}%`)});
 DB.rec.forEach(r=>{if(r.next<T)A.push(`⚠ Overdue: ${r.name} (${fmt(r.amt)}) was due ${dmy(r.next)}`)});
 DB.goals.forEach(g=>{if(g.cur>=g.target)A.push(`✓ Goal reached: ${g.name}`)});
 if(net(M(range('tm')))<0)A.push('✖ Net cash flow is negative this month');
 if(DB.tx.some(t=>t.status=='Pending'))A.push('ℹ You have pending transactions (not counted in totals)');return A}

/* ===== UI HELPERS ===== */
const CH={};function ch(id,cfg){if(!window.Chart)return;if(CH[id])CH[id].destroy();const c=$('#'+id);if(!c)return;
 cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,plugins:{tooltip:{callbacks:{label:x=>`${x.dataset.label||x.label}: ${fmt(x.raw)}`}}}},cfg.options||{});CH[id]=new Chart(c,cfg)}
const cv=id=>`<div class="cv"><canvas id="${id}"></canvas></div>`,PAL=['#2f5fd0','#0f9d6b','#e98a15','#d63b3b','#7b4fd0','#14a3b8','#8a94a8','#c2528b','#6a8f2f','#a0714f'];
const delta=(a,b,goodUp=true)=>{const p=pc(a,b);if(p==null)return`<span class="d mu">vs previous: N/A</span>`;const g=(p>=0)==goodUp;return`<span class="d ${p==0?'mu':g?'good':'bad'}">${p>=0?'▲':'▼'} ${pf(p)} vs previous</span>`};
function form(title,fields,vals,onSave){const d=$('#dlg');d.innerHTML=`<form method="dialog"><h3>${title}</h3>${fields.map(f=>`<label>${f.l}${f.o?`<select name="${f.k}">${f.o.map(o=>`<option ${vals[f.k]==o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(vals[f.k])}" ${f.t=='number'?'step="any" min="0"':''} ${f.r?'required':''}>`}</label>`).join('')}<div class="row"><button value="ok">Save</button><button class="s" value="x" formnovalidate>Cancel</button></div></form>`;
 d.showModal();d.querySelector('form').onsubmit=e=>{if(e.submitter.value!='ok')return;const o=Object.fromEntries(new FormData(e.target));if(onSave(o)===false)e.preventDefault();else{save();go()}}}
const accN=()=>DB.acc.map(a=>a.n);
function addTx(t,dup){const e=t&&!dup,v=t?{...t,amt:(t.amt/100)}:{date:T,type:'expense',cat:ECATS[0],amt:'',acct:accN()[0],to:accN()[1]||accN()[0],method:'M-Pesa',status:'Completed',desc:''};
 form(e?'Edit transaction':'Add transaction',[{k:'date',l:'Date',t:'date',r:1},{k:'type',l:'Type (transfers & savings are not expenses)',o:TYPES},{k:'cat',l:'Category',o:[...new Set([...ECATS,...ICATS,'Savings','Loan principal','Loan interest','Adjustment','Refund'])]},{k:'desc',l:'Description / merchant',r:1},{k:'amt',l:'Amount (KSh)',t:'number',r:1},{k:'acct',l:'Account (from)',o:accN()},{k:'to',l:'To account (transfers only)',o:accN()},{k:'method',l:'Payment method',o:METH},{k:'status',l:'Status',o:['Completed','Pending','Cancelled','Reversed']}],v,o=>{
  const a=toC(o.amt);if(!(a>0)||!o.date){alert('Enter a valid date and an amount greater than zero. Use a refund/adjustment type instead of negative expenses.');return false}
  if(o.type=='transfer'&&o.acct==o.to){alert('Transfer accounts must differ.');return false}
  const r={...(e?t:{id:uid()}),...o,amt:a};delete r.demo;if(e)DB.tx[DB.tx.findIndex(x=>x.id==t.id)]=r;else DB.tx.unshift(r)})}
function theme(){document.documentElement.dataset.t=DB.set.theme}
function showAlerts(){const a=alerts();const d=$('#dlg');d.innerHTML=`<h3>Notifications</h3>${a.length?a.map(x=>`<p>${esc(x)}</p>`).join(''):'<p class="mu">All clear. No alerts.</p>'}<button class="s" onclick="$('#dlg').close()">Close</button>`;d.showModal()}
function dl(n,t,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()}
const csvq=v=>`"${String(v??'').replace(/"/g,'""')}"`;
function csvp(t){const R=[];let r=[],f='',q=0;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=0}else f+=c}else if(c=='"')q=1;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';R.push(r);r=[]}else f+=c}if(f||r.length){r.push(f);R.push(r)}return R.filter(x=>x.join('').trim())}
const txCSV=l=>'\ufeffDate,ID,Type,Category,Description,Amount_KES,Account,Method,Status\n'+l.map(t=>[dmy(t.date),t.id,t.type,t.cat,t.desc,(t.amt/100).toFixed(2),t.acct,t.method,t.status].map(csvq).join(',')).join('\n');
const filtered=()=>{const [a,b]=range(),q=UI.q.toLowerCase();return DB.tx.filter(t=>t.date>=a&&t.date<=b&&(!UI.type||t.type==UI.type)&&(!UI.cat||t.cat==UI.cat)&&(!q||[t.desc,t.cat,t.acct,t.method,t.id].join(' ').toLowerCase().includes(q))).sort((x,y)=>y.date.localeCompare(x.date))};

/* ===== VIEWS ===== */
let post=()=>{};
const NAV=[['ov','Overview'],['tx','Transactions'],['bu','Budgets'],['cp','Comparison'],['cf','Cash Flow'],['go','Savings & Goals'],['de','Debt'],['re','Recurring'],['fc','Forecast'],['ac','Accounts'],['dm','Tools & Data']];let cur='ov';
const V={
ov(){const r=range(),p=prev(r),c=M(r),q=M(p),n=net(c),days=Math.max(1,Math.round((D(r[1]>T?T:r[1])-D(r[0]))/864e5)+1),sr=c.inc?c.sav/c.inc*100:0;
 const bs=budStat(),tb=bs.reduce((s,b)=>s+b.amt,0),ta=bs.reduce((s,b)=>s+b.act,0),h=health(),cs=catSpend(r),top=Object.entries(cs).sort((a,b)=>b[1]-a[1]),pcs=catSpend(p);
 const K=(l,v,d,go)=>`<div class="card k" onclick="${go||''}"><small>${l}</small><b>${v}</b>${d||''}</div>`,dr=`UI.type='%';UI.cat='';go('tx')`;
 let ins=`Income for the period is <b>${fmt(c.inc)}</b> and expenses are <b>${fmt(c.exp)}</b>, giving ${n>=0?'positive':'negative'} net cash flow of <b>${fmt(n)}</b>. `+(c.inc?`Savings rate is ${sr.toFixed(1)}%. `:'No income recorded in this period. ');
 if(top[0])ins+=`Largest category: ${esc(top[0][0])} (${(top[0][1]/c.exp*100).toFixed(0)}% of spending). `;
 const ch2=top.map(([k,v])=>[k,pc(v,pcs[k]||0)]).filter(x=>x[1]!=null).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]))[0];if(ch2&&Math.abs(ch2[1])>=5)ins+=`${esc(ch2[0])} spending ${ch2[1]>0?'rose':'fell'} ${Math.abs(ch2[1]).toFixed(0)}% versus the previous period. `;
 if(c.exp>c.inc&&c.inc)ins+='Spending exceeds income, so review discretionary categories. ';
 post=()=>{const ms=months(6),d=ms.map(m=>M(m.r));
  ch('c1',{type:'bar',data:{labels:ms.map(m=>m.l),datasets:[{label:'Income',data:d.map(x=>x.inc/100),backgroundColor:'#2f5fd0'},{label:'Expenses',data:d.map(x=>x.exp/100),backgroundColor:'#d63b3b'}]}});
  ch('c2',{type:'doughnut',data:{labels:top.map(x=>x[0]),datasets:[{data:top.map(x=>x[1]/100),backgroundColor:PAL}]},options:{onClick:(e,a)=>{if(a[0]){UI.cat=top[a[0].index][0];UI.type='expense';go('tx')}},plugins:{tooltip:{callbacks:{label:x=>`${x.label}: ${fmt(x.raw*100)}`}}}}});
  ch('c3',{type:'line',data:{labels:ms.map(m=>m.l),datasets:[{label:'Net cash flow',data:d.map(x=>net(x)/100),borderColor:'#0f9d6b',backgroundColor:'#0f9d6b33',fill:true,tension:.3},{label:'Savings',data:d.map(x=>x.sav/100),borderColor:'#7b4fd0',tension:.3}]}})};
 return`<h1>Overview</h1><div class="g">${K('Total income',fmt(c.inc),delta(c.inc,q.inc),dr.replace('%','income'))}${K('Total expenses',fmt(c.exp),delta(c.exp,q.exp,false),dr.replace('%','expense'))}${K('Net cash flow',(n>=0?'▲ ':'▼ ')+fmt(n),delta(n,net(q)))}${K('Savings',fmt(c.sav),delta(c.sav,q.sav),dr.replace('%','savings'))}</div>

const addRec=()=>form('Recurring payment',[{k:'name',l:'Name',r:1},{k:'amt',l:'Amount (KSh)',t:'number',r:1},{k:'cat',l:'Category',o:ECATS},{k:'freq',l:'Frequency',o:['daily','weekly','fortnightly','monthly','quarterly','annually']},{k:'next',l:'Next due date',t:'date',r:1}],{next:T,freq:'monthly'},o=>{if(!(toC(o.amt)>0))return false;DB.rec.push({id:uid(),name:o.name,amt:toC(o.amt),cat:o.cat,freq:o.freq,next:o.next})});
function payRec(id){const r=DB.rec.find(x=>x.id==id);DB.tx.unshift({id:uid(),date:r.next>T?T:r.next,type:'expense',cat:r.cat,desc:r.name+' (recurring)',amt:r.amt,acct:accN()[0],method:'Other',status:'Completed'});const d=D(r.next),s={daily:[0,1],weekly:[0,7],fortnightly:[0,14],monthly:[1,0],quarterly:[3,0],annually:[12,0]}[r.freq],e=new Date(d.getFullYear(),d.getMonth()+s[0],d.getDate()+s[1]);if(s[0]&&e.getDate()!=d.getDate())e.setDate(0);r.next=iso(e);save();go()}
const addAcc=()=>form('New account',[{k:'n',l:'Account name',r:1},{k:'open',l:'Opening balance (KSh)',t:'number',r:1}],{open:0},o=>{if(accN().includes(o.n)){alert('Account name already exists.');return false}DB.acc.push({n:o.n,open:toC(o.open)})});
const delAcc=i=>{const a=DB.acc[i];if(DB.tx.some(t=>t.acct==a.n||t.to==a.n))return alert('This account has transactions and cannot be deleted.');if(confirm('Delete account?')){DB.acc.splice(i,1);save();go()}};
const recon=i=>form('Reconcile '+DB.acc[i].n,[{k:'act',l:'Actual balance (KSh)',t:'number',r:1}],{},o=>{const a=DB.acc[i],diff=toC(o.act)-bal(a);if(!diff){alert('Balances match.');return}if(confirm(`Difference of ${fmt(diff)}. Post an adjustment transaction?`)){DB.tx.unshift({id:uid(),date:T,type:diff>0?'income':'expense',cat:'Adjustment',desc:'Reconciliation adjustment',amt:Math.abs(diff),acct:a.n,method:'Other',status:'Completed'})}});
const backup=()=>{DB.set.lastBackup=T;save();dl('finance_backup_'+T+'.json',JSON.stringify(DB),'application/json');go()};
function restore(f){if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.tx)||!d.acc||!d.set)throw 0;if(confirm(`Replace current data with backup (${d.tx.length} transactions)?`)){DB=d;save();theme();go()}}catch(e){alert('Invalid backup file.')}})}
function impCSV(f){if(!f)return;f.text().then(t=>{const R=csvp(t.replace(/^\ufeff/,'')),h=R.shift().map(x=>x.trim().toLowerCase()),ix=k=>h.indexOf(k);let ok=0,dup=0,bad=[];
 R.forEach((r,n)=>{let d=r[ix('date')]?.trim();if(/^\d\d\/\d\d\/\d{4}$/.test(d))d=d.split('/').reverse().join('-');const ty=(r[ix('type')]||'').trim().toLowerCase(),a=toC(r[ix('amount')]),acct=(r[ix('account')]||'').trim()||accN()[0];
  if(!/^\d{4}-\d\d-\d\d$/.test(d||'')||!TYPES.includes(ty)||!(a>0)||!accN().includes(acct)){bad.push(n+2);return}const desc=r[ix('description')]||'';
  if(DB.tx.some(x=>x.date==d&&x.amt==a&&x.type==ty&&x.desc==desc)){dup++;return}DB.tx.push({id:uid(),date:d,type:ty,cat:r[ix('category')]||'Other',desc,amt:a,acct,method:'Other',status:'Completed'});ok++});
 save();alert(`Imported ${ok}. Skipped ${dup} duplicate(s). Rejected ${bad.length} row(s)${bad.length?' (lines '+bad.slice(0,15).join(', ')+')':''}. Accounts must already exist; dates as YYYY-MM-DD or DD/MM/YYYY.`);go()})}
const rmDemo=()=>{if(confirm('Remove demo transactions, budgets, goals, debts and recurring items? Your own records stay.')){['tx','bud','goals','debts','rec'].forEach(k=>DB[k]=DB[k].filter(x=>!x.demo));save();go()}};
const clearAll=()=>{if(prompt('This permanently erases ALL records. Back up first. Type DELETE to confirm.')=='DELETE'){localStorage.removeItem(K);DB=blank();save();go()}};
function loan(){const P=+$('#lp').value,r=+$('#lr').value,n=Math.round(+$('#ln').value);if(!(P>0&&n>0))return $('#lo').innerHTML='';const a=amort(P,r||0,n,$('#lm').value=='1'),c=x=>fmt(x*100);
 $('#lo').innerHTML=`<p>Monthly repayment: <b>${c(a.pay)}</b><br>Total interest: ${c(a.int)}<br>Total repayment: ${c(a.tot)}</p><div class="tw" style="max-height:220px;overflow:auto"><table><tr><th>#</th><th>Principal</th><th>Interest</th><th>Balance</th></tr>${a.rows.slice(0,60).map(x=>`<tr><td>${x.i}</td><td>${c(x.p)}</td><td>${c(x.int)}</td><td>${c(x.bal)}</td></tr>`).join('')}</table></div>`}
function qc(){const v=id=>+$('#'+id).value,p=pc(v('p2'),v('p1'));$('#po').textContent=$('#p1').value?pf(p):'–';$('#do').textContent=v('d1')?`${fmt(v('d1')*(1-v('d2')/100)*100)} (saves ${fmt(v('d1')*v('d2'))})`:'–';$('#so').textContent=v('s2')>0&&v('s1')?fmt(v('s1')/v('s2')*100)+' each':'–'}
theme();go();
</script></body></html>
